[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalphysics-workbench"
version = "1.0.0"
description = "Independent finite-volume toolkit for 1D transient heat conduction, numerical verification, and scientific visualization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "ThermalPhysics Workbench contributors"}]
keywords = ["heat-transfer", "finite-volume", "crank-nicolson", "pde", "scientific-computing", "thermal-physics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent"
]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10", "ruff>=0.8,<1"]
ui = ["streamlit>=1.35,<2"]

[project.scripts]
thermalphysics = "thermalphysics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
