name: Tests and numerical verification
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run automated tests
        run: python -m pytest
      - name: Numerical verification
        run: thermalphysics verify --output verification-ci
      - name: Upload verification figures
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: validation-figures
          path: verification-ci/*.png

      - name: Compile and verify C++ numerical reference
        if: matrix.python-version == '3.12'
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic cpp/heat1d_explicit.cpp -o /tmp/thermal_heat1d
          /tmp/thermal_heat1d 80 8000 0.0005 /tmp/thermal_cpp_profile.csv
          python scripts/compare_cpp_python.py /tmp/thermal_cpp_profile.csv
